spring:
  application:
    name: movie

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/movie}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secretKey: ${JWT_SECRET}
  expirationAccessToken: 7200000
  expirationRefreshToken: 2592000000

inbox:
  email: ${INBOX_EMAIL}

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  success-url: "http://localhost:5173/booking/success"
  cancel-url: "http://localhost:5173/booking/cancel"